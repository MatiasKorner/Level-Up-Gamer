<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level-Up Gamer - Puntos LevelUp</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/cuenta.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="perfil.html" class="back-arrow" aria-label="Volver">&larr;</a>
      <h1 class="page-title">Puntos LevelUp</h1>
      <span style="width:1.3rem"></span>
    </header>

    <main class="container px-3 pb-5">
      <div class="puntos-card">
        <p class="etiqueta">Tu saldo</p>
        <p class="valor" id="puntos-valor">0</p>
        <p class="sub">Puntos LevelUp</p>

        <p class="nivel-progreso" id="nivel-progreso-texto">Nivel - &rarr; Nivel -</p>
        <div class="barra-progreso"><div class="barra-progreso-fill" id="barra-progreso-fill" style="width:0%"></div></div>
        <div class="rango"><span id="rango-actual">0 pts</span><span id="rango-siguiente">0 pts</span></div>
      </div>

      <p class="logros-titulo">Logros</p>
      <div class="logros-grid">
        <div class="logro" title="Francotirador">🎯</div>
        <div class="logro" title="Comprador Diamante">💎</div>
        <div class="logro" title="En Llamas">🔥</div>
        <div class="logro bloqueado" title="Bloqueado">?</div>
        <div class="logro bloqueado" title="Bloqueado">?</div>
        <div class="logro bloqueado" title="Bloqueado">?</div>
      </div>

      <p class="logros-titulo">Canjear recompensas</p>

      <div class="reward-card">
        <div>
          <p class="titulo">Cupón 10% de descuento</p>
          <p class="costo">500 pts</p>
        </div>
        <button type="button" class="reward-btn" data-costo="500" data-nombre="Cupón 10% de descuento">Canjear</button>
      </div>

      <div class="reward-card">
        <div>
          <p class="titulo">$10.000 CLP en crédito</p>
          <p class="costo">2.500 pts</p>
        </div>
        <button type="button" class="reward-btn" data-costo="2500" data-nombre="$10.000 CLP en crédito">Canjear</button>
      </div>

      <div class="reward-card">
        <div>
          <p class="titulo">Envío gratis — 3 usos</p>
          <p class="costo">1.000 pts</p>
        </div>
        <button type="button" class="reward-btn" data-costo="1000" data-nombre="Envío gratis — 3 usos">Canjear</button>
      </div>
    </main>
  </div>

  <script src="js/tienda.js"></script>
  <script src="js/puntos.js"></script>
</body>
</html>
