<!DOCTYPE html>
<html lang="es">

<head>
    <!-- UTF-8 para los caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Se ajusta el tamaño para que el contenido se vea bien en cualquier dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Juego terminado</title>

    <!-- Se carga bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- prepara la conexion con Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- hace algo similar pero para el servidor de fuentes de google -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Carga Orbitron, una fuente "futurista" -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Se carga el archivo "error.css" -->
    <link rel="stylesheet" href="css/error.css">
</head>

<body>
    <!-- class="error-page: se da nombre a la clase 
     d-flex:  es una clase de bootstrap para organizar elementos hijos
     flex-column: organiza los elementos hijos en columna, transformando el eje principal en vertical
     justify-content-center: centra los elementos hijos en el eje principal
     align-items-center: centra los elementos hijos en el eje secundario -->
    <main class="error-page d-flex flex-column justify-content-center align-items-center">

        <h1 class="error-code">404</h1>
        <span class="error-skull">💀</span>
        <span class="error-title">JUEGO TERMINADO</span>
        <p class="error-subtitle">PÁGINA NO ENCONTRADA</p>
        <p class="error-description">Este nivel no existe, Jugador. La URL que ingresaste fue borrada de la matriz del
            servidor. Renace e inténtalo de nuevo.
        </p>

        <img src="img/error-decoration.png" alt="" class="error-decoration">

        <div class="error-actions">
            <a href="index.html" class="error-button error-button-first">↩ RENACER – IR AL INICIO</a>

            <a href="#" class="error-button error-button-second">📞 REPORTAR ESTE ERROR</a>

        </div>

    </main>

</body>

</html>
