<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Gamer</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/blog.css">
</head>

<body class="blog-page">

    <!--
    container: centra el contenido y le da un ancho máximo
    py-4: agrega un padding vertical de 4 unidades (arriba y abajo) -->
    <main class="container py-4">

        <!-- "mb-4": deja una espacio de margen debajo del elemento, evita que el texto se vea demasiado cerca a los btns -->
        <h1 class="blog-title mb-4">BLOG GAMER</h1>

        <div class="category-filters d-flex flex-wrap gap-2 mb-4">
            <button class="category-btn active">Todo</button>
            <button class="category-btn">Reseñas</button>
            <button class="category-btn">Hardware</button>
            <button class="category-btn">Consejos</button>
            <button class="category-btn">Esports</button>
        </div>

        <!-- Post destacado -->
        <article class="featured-post mb-4">
            <!-- al hacer click se redirije al href -->
            <a href="#" class="featured-link">
                <div class="featured-image-wrapper">
                    <!-- imagen destacada en el blog-->
                    <img src="img/featured-article.png" alt="Top 10 RPGs del 2026" class="featured-image">
                    <!-- Aparece la "medalla" de destacado -->
                    <span class="featured-badge">DESTACADO</span>
                </div>

                <div class="featured-content">
                    <!-- Titulo del post destacado -->
                    <h2 class="featured-title">Top 10 RPGs del 2026: Los Mejores del Año</h2>

                    <div class="featured-meta">
                        <!-- Categoria -->
                        <span class="post-category">RESEÑAS</span>
                        <!-- Cuando se subio el post -->
                        <span class="post-time">hace 2d</span>
                    </div>
                </div>
            </a>
        </article>

        <!-- lista de post -->
        <!-- estructura base del post -->
        <div class="post-list">
            <!-- redirige a la pagina articulo.html -->
            <a href="articulo.html" class="post-card">
                <!-- img que aparece en el post -->
                <img src="img/first-post.jpeg" alt="RTX 5090" class="post-card-image">
                <div class="post-card-content">
                    <!-- Titulo del post -->
                    <h3 class="post-card-title">RTX 5090 Ti ¿Vale la Pena el Precio?</h3>

                    <div class="post-card-meta">
                        <!-- Categoria del post -->
                        <span class="post-card-category">HARDWARE</span>
                        <!-- cuando se publico el post -->
                        <span class="post-card-time">hace 5h</span>
                    </div>
                </div>
            </a>

            <!-- Segundo post -->
            <a href="#" class="post-card">
                <img src="img/second-post.jpg" alt="Setup Gamer" class="post-card-image">
                <div class="post-card-content">
                    <h3 class="post-card-title">Guia Definitiva: Setup Gamer Chile 2026</h3>
                    <div class="post-card-meta">
                        <span class="post-card-category">CONSEJOS</span>
                        <span class="post-card-time">hace 1d</span>
                    </div>
                </div>
            </a>

            <!-- tercer post -->
            <a href="#" class="post-card">
                <img src="img/third-post.jpg" alt="Esport Chile" class="post-card-image">
                <div class="post-card-content">
                    <h3 class="post-card-title">Esports en Chile 2026: Estado del Arte</h3>
                    <div class="post-card-meta">
                        <span class="post-card-category">ESPORTS</span>
                        <span class="post-card-time">hace 3d</span>
                    </div>
                </div>
            </a>

        </div>



    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
