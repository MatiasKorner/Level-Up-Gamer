<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level-Up Gamer - Historial de Pedidos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/cuenta.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="perfil.html" class="back-arrow" aria-label="Volver">&larr;</a>
      <h1 class="page-title">Historial de Pedidos</h1>
      <span style="width:1.3rem"></span>
    </header>

    <main class="container px-3 pb-5">
      <div class="order-tabs">
        <button type="button" class="order-tab active" data-filtro="todos">Todos</button>
        <button type="button" class="order-tab" data-filtro="en_camino">En camino</button>
        <button type="button" class="order-tab" data-filtro="entregado">Entregado</button>
        <button type="button" class="order-tab" data-filtro="cancelado">Cancelado</button>
      </div>

      <div id="lista-pedidos"></div>
      <div id="sin-pedidos" class="sin-resultados d-none">No hay pedidos en esta categoría.</div>
    </main>
  </div>

  <script src="js/tienda.js"></script>
  <script src="js/pedidos.js"></script>
</body>
</html>
