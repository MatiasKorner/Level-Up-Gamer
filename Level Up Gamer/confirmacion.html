<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level-Up Gamer - Pedido Confirmado</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/compras.css">
</head>
<body>
  <div class="app-shell">
    <main class="container px-3 pb-5">
      <div class="confirmacion-wrap">
        <div class="circulo-exito">✓</div>
        <h1>¡Pedido confirmado!</h1>
        <p>Tu equipamiento gamer está en camino, ¡Jugador!<br>Prepárate para subir de nivel.</p>

        <div class="orden-card">
          <div class="fila"><span>N° de Pedido</span><span id="dato-id"></span></div>
          <div class="fila"><span>Fecha</span><span id="dato-fecha"></span></div>
          <div class="fila"><span>Total</span><span id="dato-total"></span></div>
          <div class="fila"><span>Entrega</span><span id="dato-entrega"></span></div>
          <div class="fila"><span>Pago</span><span id="dato-pago"></span></div>
        </div>

        <div class="puntos-ganados" id="dato-puntos"></div>

        <a href="pedidos.html" class="btn btn-confirmar w-100 fw-bold text-uppercase py-2 mt-4">
          🔁 Rastrear mi pedido
        </a>
        <a href="catalogo.html" class="btn btn-outline-light w-100 fw-bold text-uppercase py-2 mt-2">
          Seguir comprando
        </a>
      </div>
    </main>
  </div>

  <script src="js/tienda.js"></script>
  <script src="js/confirmacion.js"></script>
</body>
</html>
