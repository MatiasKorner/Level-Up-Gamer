<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level-Up Gamer - Mi Carrito</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/compras.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="catalogo.html" class="back-arrow" aria-label="Volver">&larr;</a>
      <h1 class="page-title">Mi Carrito</h1>
      <button class="icon-button" aria-label="Carrito">
        🛒<span class="badge-count" id="cart-count-badge">0</span>
      </button>
    </header>

    <main class="container px-3 pb-5">
      <p class="subtitulo-pagina" id="carrito-subtitulo">Cargando...</p>

      <div id="carrito-lista"></div>

      <div id="carrito-vacio" class="sin-resultados d-none">
        Tu carrito está vacío. <a href="catalogo.html" class="enlace-registro">Ver catálogo &rarr;</a>
      </div>

      <div id="carrito-con-items">
        <div class="promo-box" id="beneficio-duoc">
          <p>🎓 Beneficio Duoc UC: 20% de descuento</p>
        </div>

        <div class="summary-box">
          <div class="summary-row"><span>Subtotal</span><span id="resumen-subtotal">$0 CLP</span></div>
          <div class="summary-row descuento"><span id="resumen-descuento-label">Descuento</span><span id="resumen-descuento">-$0 CLP</span></div>
          <div class="summary-row envio"><span>Envío</span><span>Gratis</span></div>
          <div class="summary-row total"><span>Total</span><span id="resumen-total">$0 CLP</span></div>
        </div>

        <a href="pago.html" class="btn btn-primary w-100 fw-bold text-uppercase py-2" id="btn-proceder">
          Proceder al pago &rarr;
        </a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="index.html">🏠<span>Inicio</span></a>
      <a href="catalogo.html">🎮<span>Catálogo</span></a>
      <a class="active" href="carrito.html">🛒<span>Carrito</span></a>
      <a href="perfil.html">👤<span>Perfil</span></a>
    </nav>
  </div>

  <script src="js/tienda.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
