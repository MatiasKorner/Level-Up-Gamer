<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level-Up Gamer - Proceso de Pago</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/compras.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="carrito.html" class="back-arrow" aria-label="Volver">&larr;</a>
      <h1 class="page-title">Proceso de Pago</h1>
      <span style="width:1.3rem"></span>
    </header>

    <main class="container px-3 pb-5">
      <div class="pasos-checkout">
        <div class="paso activo" data-paso="1"><span class="circulo">1</span>Envío</div>
        <div class="linea-paso"></div>
        <div class="paso" data-paso="2"><span class="circulo">2</span>Pago</div>
        <div class="linea-paso"></div>
        <div class="paso" data-paso="3"><span class="circulo">3</span>Confirmar</div>
      </div>

      <!-- Paso 1: Dirección de envío -->
      <form id="form-envio" class="paso-form activo" novalidate>
        <p class="seccion-titulo">Dirección de envío</p>

        <div class="campo-form mb-3">
          <input type="text" id="envio-nombre" class="form-control bg-dark text-white border-secondary" placeholder="Nombre completo">
        </div>
        <div class="campo-form mb-3">
          <input type="text" id="envio-direccion" class="form-control bg-dark text-white border-secondary" placeholder="Calle, número y depto.">
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6 campo-form">
            <input type="text" id="envio-ciudad" class="form-control bg-dark text-white border-secondary" placeholder="Ciudad">
          </div>
          <div class="col-6 campo-form">
            <select id="envio-region" class="form-select bg-dark text-white border-secondary">
              <option value="" selected disabled>Región</option>
              <option>Región Metropolitana</option>
              <option>Valparaíso</option>
              <option>Biobío</option>
              <option>Los Lagos</option>
              <option>Antofagasta</option>
              <option>Coquimbo</option>
              <option>Otra</option>
            </select>
          </div>
        </div>
        <div class="campo-form mb-4">
          <input type="tel" id="envio-telefono" class="form-control bg-dark text-white border-secondary" placeholder="Número de teléfono (+56 9 xxxx xxxx)">
        </div>

        <p class="seccion-titulo">Método de envío</p>
        <label class="opcion-radio">
          <input type="radio" name="metodo-envio" value="estandar" checked>
          <span class="detalle"><strong>Estándar (3-5 días hábiles)</strong><small>Sin costo adicional</small></span>
          <span class="precio-opcion">Gratis</span>
        </label>
        <label class="opcion-radio">
          <input type="radio" name="metodo-envio" value="express" data-precio="4990">
          <span class="detalle"><strong>Express (1-2 días hábiles)</strong><small>Llega más rápido</small></span>
          <span class="precio-opcion">$4.990</span>
        </label>
        <label class="opcion-radio">
          <input type="radio" name="metodo-envio" value="mismo-dia" data-precio="9990">
          <span class="detalle"><strong>Mismo día (solo RM)</strong><small>Pedidos antes de las 14:00</small></span>
          <span class="precio-opcion">$9.990</span>
        </label>

        <div class="summary-box mt-3">
          <div class="summary-row total"><span>Total del pedido</span><span id="total-paso1">$0 CLP</span></div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold text-uppercase py-2">
          Continuar al pago &rarr;
        </button>
      </form>

      <!-- Paso 2: Método de pago -->
      <form id="form-pago" class="paso-form" novalidate>
        <p class="seccion-titulo">Método de pago</p>

        <label class="opcion-radio">
          <input type="radio" name="metodo-pago" value="Webpay Débito" checked>
          <span class="detalle"><strong>Webpay Débito</strong><small>Pago inmediato desde tu cuenta</small></span>
        </label>
        <label class="opcion-radio">
          <input type="radio" name="metodo-pago" value="Webpay Crédito">
          <span class="detalle"><strong>Webpay Crédito</strong><small>Hasta 3 cuotas sin interés</small></span>
        </label>
        <label class="opcion-radio">
          <input type="radio" name="metodo-pago" value="Transferencia Bancaria">
          <span class="detalle"><strong>Transferencia Bancaria</strong><small>Confirmación manual (24 hrs)</small></span>
        </label>

        <div class="d-flex gap-2 mt-4">
          <button type="button" class="btn btn-outline-light w-50" data-volver="1">&larr; Volver</button>
          <button type="submit" class="btn btn-primary w-50 fw-bold text-uppercase">Continuar &rarr;</button>
        </div>
      </form>

      <!-- Paso 3: Confirmar -->
      <div id="paso-confirmar" class="paso-form">
        <p class="seccion-titulo">Resumen del pedido</p>

        <div class="summary-box">
          <div class="summary-row"><span>Envío a</span><span id="resumen-nombre"></span></div>
          <div class="summary-row"><span>Dirección</span><span id="resumen-direccion"></span></div>
          <div class="summary-row"><span>Método de envío</span><span id="resumen-metodo-envio"></span></div>
          <div class="summary-row"><span>Método de pago</span><span id="resumen-metodo-pago"></span></div>
          <div class="summary-row total"><span>Total a pagar</span><span id="total-paso3">$0 CLP</span></div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="button" class="btn btn-outline-light w-50" data-volver="2">&larr; Volver</button>
          <button type="button" id="btn-confirmar-pedido" class="btn btn-confirmar w-50 fw-bold text-uppercase">Confirmar pedido</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/tienda.js"></script>
  <script src="js/pago.js"></script>
</body>
</html>
