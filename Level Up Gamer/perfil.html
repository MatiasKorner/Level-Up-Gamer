<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level-Up Gamer - Mi Perfil</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/cuenta.css">
</head>
<body>
  <div class="app-shell">
    <main class="container px-3 pb-5 pt-4">
      <div class="perfil-header">
        <h1 class="page-title">Mi Perfil</h1>
        <button type="button" class="enlace-editar" data-bs-toggle="modal" data-bs-target="#modal-editar-perfil">
          Editar ✏
        </button>
      </div>

      <div class="perfil-datos">
        <div class="avatar-circle">🎮</div>
        <div>
          <h2 id="perfil-nombre">-</h2>
          <p class="correo" id="perfil-correo">-</p>
          <span class="badge-nivel" id="perfil-badge-nivel">-</span>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-box"><strong id="stat-nivel">-</strong><span>Nivel</span></div>
        <div class="stat-box"><strong id="stat-puntos">-</strong><span>Puntos</span></div>
        <div class="stat-box"><strong id="stat-pedidos">-</strong><span>Pedidos</span></div>
      </div>

      <ul class="menu-list">
        <li>
          <a class="menu-item" href="puntos.html">
            <span class="icono">⭐</span>
            <span class="texto"><strong>Puntos LevelUp</strong><small id="menu-puntos-detalle">-</small></span>
            <span class="chevron">›</span>
          </a>
        </li>
        <li>
          <a class="menu-item" href="pedidos.html">
            <span class="icono">📦</span>
            <span class="texto"><strong>Historial de Pedidos</strong><small id="menu-pedidos-detalle">-</small></span>
            <span class="chevron">›</span>
          </a>
        </li>
        <li>
          <button type="button" class="menu-item" data-proximamente="Métodos de Pago">
            <span class="icono">💳</span>
            <span class="texto"><strong>Métodos de Pago</strong><small>2 tarjetas guardadas</small></span>
            <span class="chevron">›</span>
          </button>
        </li>
        <li>
          <button type="button" class="menu-item" data-proximamente="Mis Direcciones">
            <span class="icono">📍</span>
            <span class="texto"><strong>Mis Direcciones</strong><small>Santiago, Región Metropolitana</small></span>
            <span class="chevron">›</span>
          </button>
        </li>
        <li>
          <button type="button" class="menu-item" data-proximamente="Notificaciones">
            <span class="icono">🔔</span>
            <span class="texto"><strong>Notificaciones</strong><small>Push y correo activados</small></span>
            <span class="chevron">›</span>
          </button>
        </li>
        <li>
          <button type="button" class="menu-item" data-proximamente="Seguridad">
            <span class="icono">🛡</span>
            <span class="texto"><strong>Seguridad</strong><small>Verificación en 2 pasos activada</small></span>
            <span class="chevron">›</span>
          </button>
        </li>
        <li>
          <button type="button" class="menu-item peligro" id="btn-cerrar-sesion">
            <span class="icono">🚪</span>
            <span class="texto"><strong>Cerrar Sesión</strong></span>
          </button>
        </li>
      </ul>
    </main>

    <nav class="bottom-nav">
      <a href="index.html">🏠<span>Inicio</span></a>
      <a href="catalogo.html">🎮<span>Catálogo</span></a>
      <a href="carrito.html">🛒<span>Carrito</span></a>
      <a class="active" href="perfil.html">👤<span>Perfil</span></a>
    </nav>
  </div>

  <!-- Modal: formulario "Actualizar" datos del perfil -->
  <div class="modal fade" id="modal-editar-perfil" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-black text-white border border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">Actualizar mis datos</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form id="form-editar-perfil" novalidate>
          <div class="modal-body">
            <div class="campo-form mb-3">
              <label class="form-label small text-secondary" for="editar-nombre">Nombre de usuario</label>
              <input type="text" id="editar-nombre" class="form-control bg-dark text-white border-secondary">
            </div>
            <div class="campo-form mb-3">
              <label class="form-label small text-secondary" for="editar-correo">Correo electrónico</label>
              <input type="email" id="editar-correo" class="form-control bg-dark text-white border-secondary">
            </div>
            <div class="campo-form mb-3">
              <label class="form-label small text-secondary" for="editar-telefono">Teléfono</label>
              <input type="tel" id="editar-telefono" class="form-control bg-dark text-white border-secondary" placeholder="+56 9 xxxx xxxx">
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary fw-bold">Guardar cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/tienda.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
