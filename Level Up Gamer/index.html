<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Level-Up Gamer</title>

  <!-- Bootstrap: estilos prediseñados -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >

  <!-- Tus estilos propios: van después de Bootstrap para poder personalizarlo -->
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="logo" href="index.html">LEVEL-<span>UP</span></a>

      <div class="header-icons">
        <button class="icon-button" aria-label="Notificaciones">🔔</button>
        <button class="icon-button" aria-label="Carrito">🛒</button>
      </div>
    </header>

    <main class="container px-3 pb-5">
      <section class="hero-gamer">
        <span class="offer-badge">🔥 OFERTA ESPECIAL</span>
        <h1>CYBER STORM<br><span>RECARGADO</span></h1>
        <p>$29.990 CLP</p>
        <a href="#" class="btn btn-primary btn-sm">Ver oferta</a>
      </section>

      <section class="categories">
        <a href="#" class="category active">🔥 Tendencias</a>
        <a href="#" class="category">🎮 Consolas</a>
        <a href="#" class="category">💻 PC</a>
        <a href="#" class="category">🎧 Accesorios</a>
      </section>

      <section class="featured-products">
        <div class="section-title">
          <h2>Juegos destacados</h2>
          <a href="#">Ver todos →</a>
        </div>

        <div class="row g-3">
          <article class="col-6 col-md-4 col-lg-3">
            <div class="product-card">
              <img src="img/producto-1.jpg" alt="Phantom Strike">
              <h3>Phantom Strike</h3>
              <div class="product-footer">
                <span>$49.990 CLP</span>
                <button class="add-button" aria-label="Agregar Phantom Strike">+</button>
              </div>
            </div>
          </article>

          <article class="col-6 col-md-4 col-lg-3">
            <div class="product-card">
              <img src="img/producto-2.jpg" alt="Grid Runner X">
              <h3>Grid Runner X</h3>
              <div class="product-footer">
                <span>$39.990 CLP</span>
                <button class="add-button" aria-label="Agregar Grid Runner X">+</button>
              </div>
            </div>
          </article>

          <article class="col-6 col-md-4 col-lg-3">
            <div class="product-card">
              <img src="img/producto-3.jpg" alt="Dark Protocol">
              <h3>Dark Protocol</h3>
              <div class="product-footer">
                <span>$59.990 CLP</span>
                <button class="add-button" aria-label="Agregar Dark Protocol">+</button>
              </div>
            </div>
          </article>

          <article class="col-6 col-md-4 col-lg-3">
            <div class="product-card">
              <img src="img/producto-4.jpg" alt="Nova Command">
              <h3>Nova Command</h3>
              <div class="product-footer">
                <span>$44.990 CLP</span>
                <button class="add-button" aria-label="Agregar Nova Command">+</button>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a class="active" href="index.html">🏠<span>Inicio</span></a>
      <a href="catalogo.html">🎮<span>Catálogo</span></a>
      <a href="carrito.html">🛒<span>Carrito</span></a>
      <a href="perfil.html">👤<span>Perfil</span></a>
    </nav>
  </div>
</body>
</html>
